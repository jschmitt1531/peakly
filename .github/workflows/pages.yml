# SPDX-License-Identifier: MIT
# Publishes the website (docs/) and the app to GitHub Pages:
#   /               docs/index.html (landing page) and the rest of docs/
#   /app/           the app (built index.html)
#   /peakly.html    the same single file, for "download"
# One-time setup: Settings → Pages → Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # GitHub Pages on the free plan needs a public repo; skip (instead of failing) while the repo is private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # do not leave the token in .git/config

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Test and build
        run: |
          node tests/run.js
          node build.js

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/app
          cp -R docs/. _site/
          cp index.html _site/app/index.html
          cp index.html _site/peakly.html
          # plain static site: no Jekyll processing
          touch _site/.nojekyll
          # fail early if a site file the launch checklist relies on is missing
          for f in index.html 404.html robots.txt sitemap.xml favicon.svg site.webmanifest .well-known/security.txt app/index.html; do
            test -s "_site/$f" || { echo "missing _site/$f"; exit 1; }
          done
          ls -la _site _site/.well-known

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          # dot-files are dropped by default; .well-known/security.txt and .nojekyll must be deployed
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
