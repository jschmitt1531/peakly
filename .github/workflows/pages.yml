# SPDX-License-Identifier: MIT
# Publishes the website (docs/) and the app to GitHub Pages:
#   /               docs/index.html (landing page) and the rest of docs/
#   /app/           the app (built index.html)
#   /peakly.html    the same single file, for "download"
# One-time setup: Settings → Pages → Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Test and build
        run: |
          node tests/run.js
          node build.js

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/app
          cp -R docs/. _site/
          cp index.html _site/app/index.html
          cp index.html _site/peakly.html
          # plain static site: no Jekyll processing
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
